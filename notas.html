<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStudy - Notas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
</head>

<body class="pagina-home">

    <header id="header">
        <a href="home.html" class="logo-header">
            <img src="caduceu.png" alt="Logo">
            <span>MediStudy</span>
        </a>

        <div class="header-acoes">
            <button id="sino" aria-label="Notificações">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                </svg>
                <span class="badge"></span>
            </button>
            <div class="usuario-menu">
                <div class="avatar">RB</div>
                <svg class="chevron-usuario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
        </div>

    </header>

<main>

    <a href="home.html" class="link-voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Painel
    </a>

    <h1 class="titulo-pagina">Notas</h1>

    <section id="notas">
        <div class="flashcards-coluna">
            <h2 id="titulo-form-nota">Nova nota</h2>
            <form id="form-nota">
                <div class="input-group-simples">
                    <label for="campo-materia-nota">Matéria</label>
                    <input type="text" id="campo-materia-nota" placeholder="Ex: Farmacologia II" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-avaliacao-nota">Avaliação</label>
                    <input type="text" id="campo-avaliacao-nota" placeholder="Ex: P1" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-peso-nota">Peso</label>
                    <input type="number" id="campo-peso-nota" step="0.1" min="0" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-valor-nota">Nota</label>
                    <input type="number" id="campo-valor-nota" step="0.1" min="0" max="10" required>
                </div>
                <button type="submit" id="botao-salvar-nota">Adicionar nota</button>
                <button type="button" id="botao-cancelar-edicao-nota" hidden>Cancelar edição</button>
            </form>
            <p id="mensagem-notas" class="mensagem-erro" hidden></p>
        </div>

        <div class="flashcards-coluna">
            <h2>Notas lançadas</h2>
            <ul id="lista-notas"></ul>
            <p id="notas-vazio">Nenhuma nota lançada ainda.</p>
        </div>

        <div class="flashcards-coluna">
            <h2>O que falta tirar</h2>
            <div class="input-group-simples">
                <label for="select-materia-calculo">Matéria</label>
                <select id="select-materia-calculo" aria-label="Escolher matéria">
                    <option value="">Escolha a matéria...</option>
                </select>
            </div>
            <div class="input-group-simples">
                <label for="campo-media-necessaria">Média necessária</label>
                <input type="number" id="campo-media-necessaria" step="0.1" min="0" max="10" value="7">
            </div>
            <div class="input-group-simples">
                <label for="campo-peso-proxima">Peso da próxima avaliação</label>
                <input type="number" id="campo-peso-proxima" step="0.1" min="0.1" value="1">
            </div>
            <button id="botao-calcular-nota" type="button">Calcular</button>
            <p id="resultado-calculo"></p>
        </div>
    </section>

</main>

<script type="module" src="src/pages/notas/notasPage.js"></script>

</body>

</html>
