<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStudy - Notas</title>
    <link rel="icon" type="image/png" href="caduceu.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="pagina-home">

    <header id="header">
        <a href="home.html" class="logo-header">
            <img src="caduceu.png" alt="Logo">
            <span>MediStudy</span>
        </a>

        <div class="header-acoes">
            <div class="pomodoro-widget pomodoro-foco" id="pomodoro-widget">
                <button type="button" id="pomodoro-widget-botao" class="pomodoro-widget-botao" aria-haspopup="true" aria-expanded="false" aria-label="Pomodoro">
                    <span class="pomodoro-widget-icone" aria-hidden="true">🍅</span>
                    <span id="pomodoro-widget-tempo">25:00</span>
                </button>

                <div id="pomodoro-painel" class="pomodoro-painel" hidden>
                    <div class="pomodoro-painel-cabecalho">
                        <strong id="pomodoro-painel-titulo">Foco</strong>
                        <button type="button" id="pomodoro-fechar" class="pomodoro-fechar" aria-label="Fechar">×</button>
                    </div>

                    <div class="pomodoro-anel-container">
                        <svg class="pomodoro-anel" viewBox="0 0 120 120" aria-hidden="true">
                            <circle class="pomodoro-anel-fundo" cx="60" cy="60" r="54"></circle>
                            <circle id="pomodoro-anel-progresso" class="pomodoro-anel-progresso" cx="60" cy="60" r="54"></circle>
                        </svg>
                        <span id="pomodoro-tempo-grande" class="pomodoro-tempo-grande">25:00</span>
                    </div>

                    <p id="pomodoro-contador" class="pomodoro-contador">Pomodoros completados hoje: 0</p>

                    <div class="pomodoro-botoes">
                        <button type="button" id="pomodoro-iniciar-pausar">Iniciar</button>
                        <button type="button" id="pomodoro-pular" class="botao-outline">Pular</button>
                        <button type="button" id="pomodoro-reiniciar" class="botao-outline">Reiniciar</button>
                    </div>

                    <div class="pomodoro-modos" role="group" aria-label="Modo do pomodoro">
                        <button type="button" class="pomodoro-modo-botao selecionado" data-modo="padrao">25/5</button>
                        <button type="button" class="pomodoro-modo-botao" data-modo="leve">15/5</button>
                        <button type="button" class="pomodoro-modo-botao" data-modo="intenso">50/10</button>
                    </div>
                </div>
            </div>
            <button id="sino" aria-label="Notificações">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                </svg>
                <span class="badge" id="badge-revisao" hidden></span>
            </button>
            <div class="usuario-menu">
                <div class="avatar">RB</div>
                <svg class="chevron-usuario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
        </div>

    </header>

        </a>
        <a href="casos-clinicos.html" class="sidebar-link" data-pagina="casos-clinicos" aria-label="Casos Clínicos">

        </a>

            <span class="bottom-nav-label">Painel</span>
        </a>
        <a href="flashcards.html" class="bottom-nav-link" data-pagina="flashcards">
            <span class="bottom-nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="13" height="15" rx="2"/><path d="M3 3h13a2 2 0 0 1 2 2v13"/></svg></span>

        <a href="casos-clinicos.html" class="bottom-nav-link" data-pagina="casos-clinicos">
            <span class="bottom-nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-2.5 1.5-5-3-8-4.5 3-4.5 5.5-3 8"/><path d="M4 20l6-6M20 20l-6-6"/><circle cx="12" cy="9" r="1.5"/></svg></span>
            <span class="bottom-nav-label">Casos</span>
        </a>
        <a href="provas.html" class="bottom-nav-link" data-pagina="provas">

        </a>
        <a href="notas.html" class="bottom-nav-link" data-pagina="notas">

            <span class="bottom-nav-label">Notas</span>
        </a>
        <a href="em-breve.html?ferramenta=Configura%C3%A7%C3%B5es" class="bottom-nav-link" data-pagina="configuracoes">
            <span class="bottom-nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>

<main>

    <a href="home.html" class="link-voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Painel
    </a>

    <h1 class="titulo-pagina">Notas</h1>

    <p id="mensagem-notas" class="mensagem-erro" hidden></p>

    <!-- TELA 1 — ESCOLHA -->
    <section id="tela-escolha" class="tela-modo" data-tela="escolha">

        <div class="stat-cards-grid">
            <div class="stat-card" data-cor="dourado">
                <span class="stat-card-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v18M4 8h5M4 13h5M4 18h5"/><path d="M14 5l6 2-1.5 12L14 17z"/></svg>
                </span>
                <span class="stat-card-info">
                    <span class="estatistica-valor" id="stat-total-notas">0</span>
                    <span class="estatistica-rotulo">Notas lançadas</span>
                </span>
            </div>
            <div class="stat-card" data-cor="verde">
                <span class="stat-card-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-2.5 1.5-5-3-8-4.5 3-4.5 5.5-3 8"/><path d="M4 20l6-6M20 20l-6-6"/><circle cx="12" cy="9" r="1.5"/></svg>
                </span>
                <span class="stat-card-info">
                    <span class="estatistica-valor" id="stat-materias-com-notas">0</span>
                    <span class="estatistica-rotulo">Matérias com notas</span>
                </span>
            </div>
        </div>

        <div class="escolha-acoes">
            <button id="botao-ir-lancar" type="button" class="botao-escolha botao-escolha-primario">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Lançar nota
            </button>
            <button id="botao-ir-calcular" type="button" class="botao-escolha botao-escolha-secundario">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
                Calcular o que falta
            </button>
        </div>

        <button id="botao-ir-lista" type="button" class="link-modo-padrao link-ver-todos">Ver notas lançadas</button>
    </section>

    <!-- TELA 2 — LANÇAR -->
    <section id="tela-lancar" class="tela-modo" data-tela="lancar" hidden>
        <button type="button" class="botao-voltar-tela" data-voltar>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Voltar
        </button>

        <div class="flashcards-coluna flashcards-coluna-criacao">
            <h2 id="titulo-form-nota">Nova nota</h2>
            <form id="form-nota">
                <div class="input-group-simples">
                    <label for="campo-materia-nota">Matéria</label>
                    <input type="text" id="campo-materia-nota" placeholder="Ex: Farmacologia II" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-avaliacao-nota">Avaliação</label>
                    <input type="text" id="campo-avaliacao-nota" placeholder="Ex: P1" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-peso-nota">Peso</label>
                    <input type="number" id="campo-peso-nota" step="0.1" min="0" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-valor-nota">Nota</label>
                    <input type="number" id="campo-valor-nota" step="0.1" min="0" max="10" required>
                </div>
                <button type="submit" id="botao-salvar-nota">Adicionar nota</button>
                <button type="button" id="botao-cancelar-edicao-nota" class="botao-outline" hidden>Cancelar edição</button>
            </form>
        </div>
    </section>

    <!-- TELA 3 — VER NOTAS -->
    <section id="tela-lista" class="tela-modo" data-tela="lista" hidden>
        <button type="button" class="botao-voltar-tela" data-voltar>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Voltar
        </button>

        <div class="flashcards-coluna flashcards-coluna-lista">
            <h2>Notas lançadas</h2>
            <div id="notas-carregando" class="skeleton-carregando" role="status">
                <span class="sr-only">Carregando…</span>
                <span class="skeleton-barra"></span>
                <span class="skeleton-barra"></span>
                <span class="skeleton-barra skeleton-barra-media"></span>
            </div>
            <ul id="lista-notas"></ul>
            <div id="notas-vazio" class="estado-vazio" data-cor="verde" hidden>
                <span class="estado-vazio-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v18M4 8h5M4 13h5M4 18h5"/><path d="M14 5l6 2-1.5 12L14 17z"/></svg>
                </span>
                <strong class="estado-vazio-titulo">Nenhuma nota lançada</strong>
                <p>Lance sua primeira nota para acompanhar sua evolução.</p>
                <button id="botao-ir-lancar-vazio" type="button" class="estado-vazio-cta">Lançar nota</button>
            </div>
        </div>
    </section>

    <!-- TELA 4 — CALCULAR -->
    <section id="tela-calcular" class="tela-modo" data-tela="calcular" hidden>
        <button type="button" class="botao-voltar-tela" data-voltar>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Voltar
        </button>

        <div class="flashcards-coluna flashcards-coluna-criacao">
            <h2>O que falta tirar</h2>
            <div class="input-group-simples">
                <label for="select-materia-calculo">Matéria</label>
                <select id="select-materia-calculo" aria-label="Escolher matéria">
                    <option value="">Escolha a matéria...</option>
                </select>
            </div>
            <div class="input-group-simples">
                <label for="campo-media-necessaria">Média necessária</label>
                <input type="number" id="campo-media-necessaria" step="0.1" min="0" max="10" value="7">
            </div>
            <div class="input-group-simples">
                <label for="campo-peso-proxima">Peso da próxima avaliação</label>
                <input type="number" id="campo-peso-proxima" step="0.1" min="0.1" value="1">
            </div>
            <button id="botao-calcular-nota" type="button">Calcular</button>
            <p id="resultado-calculo"></p>
        </div>
    </section>

</main>

<script type="module" src="src/pages/notas/notasPage.js"></script>

</body>

</html>
