<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStudy</title>
    <link rel="icon" type="image/png" href="caduceu.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
</head>

<body>

<div id="login-container">

    <div id="tela-formulario">

    <div class="logo-container">
        <img src="caduceu.png" alt="Logo do MediStudy">
    </div>

        <h1>MediStudy</h1>

    <div class="divisor">
        <span class="linha-esquerda"></span>    
        <span class="losango"></span>
        <span class="linha-direita"></span>
    </div>

        <h2>Identificação de Usuário</h2>

    <div class="divisor-texto">
        <span class="linha-esquerda"></span>
        <span class="divisor-texto-conteudo">Bem-vindo(a) ao MediStudy!</span>
        <span class="linha-direita"></span>
    </div>

    <div class="input-group">
        <img src="email-icon.svg" class="input-icon">
        <input type="email" id="email" placeholder="Digite seu Email">
    </div>
    
    <div class="input-group">
        <img src="cadeado-icon.svg" class="input-icon">
        <input type="password" id="senha" placeholder="Digite sua senha">
    </div>

    <p id="mensagem-erro" class="mensagem-erro" hidden></p>

    <div class="botoes-acao">
        <button id="botao-entrar">Entrar <span class="seta">→</span></button>
        <button id="botao-registrar" type="button">Criar conta</button>
    </div>

    <div class="divisor">
        <span class="linha-esquerda"></span>
        <img src="ecg-icon.svg" class="ecg-icon">
        <span class="linha-direita"></span>
    </div>
    <p>Cada página estudada hoje é um passo a menos até a aprovação.</p>

    </div>

    <div id="tela-boas-vindas">
        <h1>Bem-vindo(a) ao MediStudy!</h1>
        <p>Olá! Você entrou como <span id="email-usuario"></span>.</p>
    </div>
</div>

<script type="module" src="src/pages/login/loginPage.js"></script>

</body>
</html>
