<main>

    <a href="home.html" class="link-voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Painel
    </a>

    <h1 class="titulo-pagina">Agenda de Provas</h1>

    <p id="mensagem-provas" class="mensagem-erro" hidden></p>

    <!-- TELA 1 — ESCOLHA -->
    <section id="tela-escolha" class="tela-modo" data-tela="escolha">

        <div class="stat-cards-grid">
            <div class="stat-card" data-cor="dourado">
                <span class="stat-card-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                </span>
                <span class="stat-card-info">
                    <span class="estatistica-valor" id="stat-total-provas">0</span>
                    <span class="estatistica-rotulo">Provas cadastradas</span>
                </span>
            </div>
            <div class="stat-card" data-cor="laranja">
                <span class="stat-card-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
                </span>
                <span class="stat-card-info">
                    <span class="estatistica-valor" id="stat-provas-semana">0</span>
                    <span class="estatistica-rotulo">Nos próximos 7 dias</span>
                </span>
            </div>
        </div>

        <div class="escolha-acoes">
            <button id="botao-ir-cadastrar" type="button" class="botao-escolha botao-escolha-primario">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Cadastrar prova
            </button>
        </div>

        <button id="botao-ir-lista" type="button" class="link-modo-padrao link-ver-todos">Ver provas cadastradas</button>
    </section>

    <!-- TELA 2 — CADASTRAR -->
    <section id="tela-cadastrar" class="tela-modo" data-tela="cadastrar" hidden>
        <button type="button" class="botao-voltar-tela" data-voltar>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Voltar
        </button>

        <div class="flashcards-coluna flashcards-coluna-criacao">
            <h2 id="titulo-form-prova">Nova prova</h2>
            <form id="form-prova">
                <div class="input-group-simples">
                    <label for="campo-materia-prova">Matéria</label>
                    <input type="text" id="campo-materia-prova" placeholder="Ex: Farmacologia II" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-data-prova">Data</label>
                    <input type="date" id="campo-data-prova" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-nota-necessaria-prova">Nota necessária (opcional)</label>
                    <input type="number" id="campo-nota-necessaria-prova" step="0.1" min="0" max="10" placeholder="Ex: 7">
                </div>
                <button type="submit" id="botao-salvar-prova">Adicionar prova</button>
                <button type="button" id="botao-cancelar-edicao-prova" class="botao-outline" hidden>Cancelar edição</button>
            </form>
        </div>
    </section>

    <!-- TELA 3 — VER PROVAS -->
    <section id="tela-lista" class="tela-modo" data-tela="lista" hidden>
        <button type="button" class="botao-voltar-tela" data-voltar>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Voltar
        </button>

        <div class="flashcards-coluna flashcards-coluna-lista">
            <h2>Provas cadastradas</h2>
            <div id="provas-carregando" class="skeleton-carregando" role="status">
                <span class="sr-only">Carregando…</span>
                <span class="skeleton-barra"></span>
                <span class="skeleton-barra"></span>
                <span class="skeleton-barra skeleton-barra-media"></span>
            </div>
            <ul id="lista-provas"></ul>
            <div id="provas-vazio" class="estado-vazio" data-cor="azul" hidden>
                <span class="estado-vazio-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                </span>
                <strong class="estado-vazio-titulo">Nenhuma prova cadastrada</strong>
                <p>Cadastre sua primeira prova para organizar sua agenda.</p>
                <button id="botao-ir-cadastrar-vazio" type="button" class="estado-vazio-cta">Cadastrar prova</button>
            </div>
        </div>
    </section>

</main>

<script type="module" src="src/pages/provas/provasPage.js"></script>
