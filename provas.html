<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStudy - Agenda de Provas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
</head>

<body class="pagina-home">

    <header id="header">
        <a href="home.html" class="logo-header">
            <img src="caduceu.png" alt="Logo">
            <span>MediStudy</span>
        </a>

        <div class="header-acoes">
            <button id="sino" aria-label="Notificações">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                </svg>
                <span class="badge"></span>
            </button>
            <div class="usuario-menu">
                <div class="avatar">RB</div>
                <svg class="chevron-usuario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
        </div>

    </header>

    <nav class="sidebar" aria-label="Navegação principal">
        <a href="home.html" class="sidebar-link" aria-label="Painel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        </a>
        <a href="flashcards.html" class="sidebar-link" aria-label="Flashcards">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="13" height="15" rx="2"/><path d="M3 3h13a2 2 0 0 1 2 2v13"/></svg>
        </a>
        <a href="casos-clinicos.html" class="sidebar-link" aria-label="Casos Clínicos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-2.5 1.5-5-3-8-4.5 3-4.5 5.5-3 8"/><path d="M4 20l6-6M20 20l-6-6"/><circle cx="12" cy="9" r="1.5"/></svg>
        </a>
        <a href="provas.html" class="sidebar-link ativo" aria-label="Agenda de provas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </a>
        <a href="notas.html" class="sidebar-link" aria-label="Notas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v18M4 8h5M4 13h5M4 18h5"/><path d="M14 5l6 2-1.5 12L14 17z"/></svg>
        </a>
        <a href="em-breve.html?ferramenta=Configura%C3%A7%C3%B5es" class="sidebar-link" aria-label="Configurações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
    </nav>

<main>

    <a href="home.html" class="link-voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Painel
    </a>

    <h1 class="titulo-pagina">Agenda de Provas</h1>

    <section id="provas">
        <div class="flashcards-coluna">
            <h2 id="titulo-form-prova">Nova prova</h2>
            <form id="form-prova">
                <div class="input-group-simples">
                    <label for="campo-materia-prova">Matéria</label>
                    <input type="text" id="campo-materia-prova" placeholder="Ex: Farmacologia II" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-data-prova">Data</label>
                    <input type="date" id="campo-data-prova" required>
                </div>
                <div class="input-group-simples">
                    <label for="campo-nota-necessaria-prova">Nota necessária (opcional)</label>
                    <input type="number" id="campo-nota-necessaria-prova" step="0.1" min="0" max="10" placeholder="Ex: 7">
                </div>
                <button type="submit" id="botao-salvar-prova">Adicionar prova</button>
                <button type="button" id="botao-cancelar-edicao-prova" hidden>Cancelar edição</button>
            </form>
            <p id="mensagem-provas" class="mensagem-erro" hidden></p>
        </div>

        <div class="flashcards-coluna">
            <h2>Provas cadastradas</h2>
            <p id="provas-carregando" class="estado-carregando">Carregando…</p>
            <ul id="lista-provas"></ul>
            <div id="provas-vazio" class="estado-vazio" hidden>
                <span class="estado-vazio-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                </span>
                <p>Nenhuma prova cadastrada ainda. Adicione a primeira ao lado.</p>
            </div>
        </div>
    </section>

</main>

<script type="module" src="src/pages/provas/provasPage.js"></script>

</body>

</html>
