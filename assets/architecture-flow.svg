<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" width="780" height="210" role="img" aria-label="Fluxo de dados do MediStudy hoje">
  <defs>
    <linearGradient id="flow-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c140c"/>
      <stop offset="1" stop-color="#0a0705"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="780" height="210" rx="10" fill="url(#flow-bg)" stroke="#3A2F2C" stroke-width="0.7"/>
  <rect x="0.5" y="0.5" width="779" height="209" rx="9.5" fill="none" stroke="#8a7346" stroke-width="0.4" opacity="0.35"/>

  <path d="M24,26 L34,26 L36,22 L39,30 L41,26 L48,26" fill="none" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="54" y="29" font-family="monospace" font-size="9" letter-spacing="2.5" fill="#8a7346">ARQUITETURA HOJE · FRONTEND + SUPABASE + EDGE FUNCTION</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a7346"/>
    </marker>
  </defs>

  <g font-family="monospace" font-size="10">
    <!-- passo 1: frontend Vite -->
    <rect x="24" y="66" width="146" height="76" rx="8" fill="#171018" stroke="#3A2F2C" stroke-width="0.8"/>
    <path d="M150,78 L145,86 L150,94 M164,78 L169,86 L164,94" fill="none" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="92" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#F4D06F">Frontend</text>
    <text x="38" y="112" fill="#C7C2B8">HTML/CSS/JS + Vite</text>
    <text x="38" y="128" fill="#8f8a80">deploy na Vercel</text>

    <path d="M176 104 L208 104" stroke="#8a7346" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- passo 2: supabase auth+postgres -->
    <rect x="214" y="66" width="150" height="76" rx="8" fill="#171018" stroke="#3A2F2C" stroke-width="0.8"/>
    <g transform="translate(338,82)" stroke="#C9A84C" stroke-width="1" fill="none" opacity="0.85">
      <ellipse cx="0" cy="-4" rx="7" ry="2.6"/>
      <path d="M-7,-4 L-7,4 C-7,5.5 -3,6.6 0,6.6 C3,6.6 7,5.5 7,4 L7,-4"/>
    </g>
    <text x="228" y="92" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#F4D06F">Supabase</text>
    <text x="228" y="112" fill="#C7C2B8">Auth + Postgres</text>
    <text x="228" y="128" fill="#8f8a80">flashcards, provas, notas...</text>

    <path d="M370 104 L402 104" stroke="#8a7346" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- passo 3: edge function -->
    <rect x="408" y="66" width="164" height="76" rx="8" fill="#171018" stroke="#3A2F2C" stroke-width="0.8"/>
    <path d="M534,74 L534,94 M524,84 L544,84" fill="none" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <circle cx="534" cy="84" r="10" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <text x="422" y="92" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#F4D06F">Edge Function</text>
    <text x="422" y="112" fill="#C7C2B8">gerar-caso-clinico</text>
    <text x="422" y="128" fill="#8f8a80">guarda a chave da Groq</text>

    <path d="M578 104 L610 104" stroke="#8a7346" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- passo 4: groq -->
    <rect x="616" y="66" width="140" height="76" rx="8" fill="#171018" stroke="#3A2F2C" stroke-width="0.8"/>
    <path d="M736,76 L726,84 L736,92 M746,76 L756,84 L746,92" fill="none" stroke="#7A2E3B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <text x="630" y="92" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#F4D06F">Groq</text>
    <text x="630" y="112" fill="#C7C2B8">kimi-k2-instruct</text>
    <text x="630" y="128" fill="#8f8a80">gera o caso, valida, salva</text>
  </g>

  <line x1="24" y1="164" x2="756" y2="164" stroke="#3A2F2C" stroke-width="0.5"/>
  <text x="24" y="184" font-family="monospace" font-size="10" fill="#6b5c3d">Sem servidor Express dedicado. Único ponto de IA em produção hoje: geração de Casos Clínicos.</text>
</svg>
