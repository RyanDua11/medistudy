<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 176" width="780" height="176" role="img" aria-label="Uso real do MediStudy">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c140c"/>
      <stop offset="1" stop-color="#0a0705"/>
    </linearGradient>
    <radialGradient id="card-glow" cx="0.9" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#C9A84C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <rect x="0" y="0" width="380" height="176" rx="10" fill="url(#card-bg)" stroke="#3A2F2C" stroke-width="0.7"/>
    <rect x="0" y="0" width="380" height="176" rx="10" fill="url(#card-glow)"/>
    <rect x="0.5" y="0.5" width="379" height="175" rx="9.5" fill="none" stroke="#8a7346" stroke-width="0.4" opacity="0.35"/>

    <path d="M24,28 L34,28 L36,24 L39,32 L41,28 L48,28" fill="none" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="31" font-family="monospace" font-size="9" letter-spacing="2.5" fill="#8a7346">USO REAL, NÃO SIMULADO</text>

    <!-- icone de pessoa, eco do pessoa-icon.svg do login -->
    <g transform="translate(326,34)" opacity="0.8">
      <circle r="15" fill="none" stroke="#C9A84C" stroke-width="1.1"/>
      <circle cx="0" cy="-4" r="5" fill="none" stroke="#C9A84C" stroke-width="1.1"/>
      <path d="M-9,10 C-9,2 9,2 9,10" fill="none" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <text x="24" y="102" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#F4D06F">2</text>
    <line x1="24" y1="114" x2="72" y2="114" stroke="#3A2F2C" stroke-width="0.6"/>
    <text x="24" y="134" font-family="monospace" font-size="10" fill="#C7C2B8">pessoas usando o app no dia a dia</text>
    <text x="24" y="152" font-family="monospace" font-size="10" fill="#8f8a80">Ryan e a namorada, fora de teste</text>
  </g>

  <g transform="translate(400,0)">
    <rect x="0" y="0" width="380" height="176" rx="10" fill="url(#card-bg)" stroke="#3A2F2C" stroke-width="0.7"/>
    <rect x="0" y="0" width="380" height="176" rx="10" fill="url(#card-glow)"/>
    <rect x="0.5" y="0.5" width="379" height="175" rx="9.5" fill="none" stroke="#8a7346" stroke-width="0.4" opacity="0.35"/>

    <path d="M24,28 L34,28 L36,24 L39,32 L41,28 L48,28" fill="none" stroke="#CDA349" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="31" font-family="monospace" font-size="9" letter-spacing="2.5" fill="#8a7346">QUEM ESTUDA COM O APP</text>

    <!-- capelo simplificado, curso de medicina -->
    <g transform="translate(326,32)" opacity="0.85">
      <path d="M-16,0 L0,-8 L16,0 L0,8 Z" fill="none" stroke="#CDA349" stroke-width="1.1" stroke-linejoin="round"/>
      <line x1="16" y1="0" x2="16" y2="12" stroke="#CDA349" stroke-width="1.1"/>
      <circle cx="16" cy="14" r="1.6" fill="#CDA349"/>
    </g>

    <text x="24" y="98" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#CDA349">4º período</text>
    <line x1="24" y1="114" x2="72" y2="114" stroke="#3A2F2C" stroke-width="0.6"/>
    <text x="24" y="134" font-family="monospace" font-size="10" fill="#C7C2B8">de medicina, revisão diária de matéria</text>
    <text x="24" y="152" font-family="monospace" font-size="10" fill="#8f8a80">sem base de usuário externa ainda</text>
  </g>
</svg>
