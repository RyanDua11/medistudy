<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 176" width="780" height="176" role="img" aria-label="Números reais do MediStudy">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c140c"/>
      <stop offset="1" stop-color="#0a0705"/>
    </linearGradient>
    <radialGradient id="card-glow" cx="0.9" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#C9A84C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <rect x="0" y="0" width="380" height="176" rx="10" fill="url(#card-bg)" stroke="#3A2F2C" stroke-width="0.7"/>
    <rect x="0" y="0" width="380" height="176" rx="10" fill="url(#card-glow)"/>
    <rect x="0.5" y="0.5" width="379" height="175" rx="9.5" fill="none" stroke="#8a7346" stroke-width="0.4" opacity="0.35"/>

    <path d="M24,28 L34,28 L36,24 L39,32 L41,28 L48,28" fill="none" stroke="#C9A84C" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="31" font-family="monospace" font-size="9" letter-spacing="2.5" fill="#8a7346">TDD, NÃO SÓ TESTE DEPOIS</text>

    <!-- icone de check, eco de teste passando -->
    <g transform="translate(326,34)" opacity="0.85">
      <circle r="15" fill="none" stroke="#C9A84C" stroke-width="1.1"/>
      <path d="M-6,0 L-1,6 L7,-7" fill="none" stroke="#C9A84C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="24" y="102" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#F4D06F">153</text>
    <line x1="24" y1="114" x2="72" y2="114" stroke="#3A2F2C" stroke-width="0.6"/>
    <text x="24" y="134" font-family="monospace" font-size="10" fill="#C7C2B8">testes automatizados, 100% passando</text>
    <text x="24" y="152" font-family="monospace" font-size="10" fill="#8f8a80">14 arquivos · Vitest · escritos em TDD</text>
  </g>

  <g transform="translate(400,0)">
    <rect x="0" y="0" width="380" height="176" rx="10" fill="url(#card-bg)" stroke="#3A2F2C" stroke-width="0.7"/>
    <rect x="0" y="0" width="380" height="176" rx="10" fill="url(#card-glow)"/>
    <rect x="0.5" y="0.5" width="379" height="175" rx="9.5" fill="none" stroke="#8a7346" stroke-width="0.4" opacity="0.35"/>

    <path d="M24,28 L34,28 L36,24 L39,32 L41,28 L48,28" fill="none" stroke="#CDA349" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="31" font-family="monospace" font-size="9" letter-spacing="2.5" fill="#8a7346">ISSUE → BRANCH → PR → MERGE</text>

    <!-- icone de checklist, eco de issue fechada -->
    <g transform="translate(326,34)" opacity="0.85">
      <rect x="-11" y="-13" width="22" height="26" rx="3" fill="none" stroke="#CDA349" stroke-width="1.1"/>
      <path d="M-6,-5 L-2,-1 L6,-9" fill="none" stroke="#CDA349" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-6" y1="4" x2="6" y2="4" stroke="#CDA349" stroke-width="1"/>
      <line x1="-6" y1="9" x2="3" y2="9" stroke="#CDA349" stroke-width="1"/>
    </g>

    <text x="24" y="102" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#CDA349">16</text>
    <line x1="24" y1="114" x2="72" y2="114" stroke="#3A2F2C" stroke-width="0.6"/>
    <text x="24" y="134" font-family="monospace" font-size="10" fill="#C7C2B8">issues do GitHub fechadas</text>
    <text x="24" y="152" font-family="monospace" font-size="10" fill="#8f8a80">cada uma com branch e PR rastreável</text>
  </g>
</svg>
