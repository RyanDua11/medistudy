    <style>
        .diario-secao {
            margin-bottom: var(--space-8);
        }

        .diario-secao-titulo {
            font-family: var(--font-display);
            color: var(--color-gold);
            font-size: var(--text-xl);
            margin: 0 0 var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .diario-secao-titulo svg {
            width: 20px;
            height: 20px;
            color: var(--color-gold);
        }

        .diario-padroes-lista {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .diario-padrao-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border-muted);
            border-radius: var(--radius-md);
            padding: var(--space-4) var(--space-5);
            transition: var(--transition-fast);
        }

        .diario-padrao-card:hover {
            border-color: var(--color-gold-deep);
        }

        .diario-padrao-cabecalho {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--space-3);
            margin-bottom: var(--space-2);
        }

        .diario-padrao-materia {
            font-weight: 600;
            color: var(--color-text);
            font-size: var(--text-md);
        }

        .diario-padrao-total {
            font-size: var(--text-sm);
            color: var(--color-gold-bright);
            font-weight: 600;
            white-space: nowrap;
        }

        .diario-padrao-barra {
            height: 8px;
            border-radius: var(--radius-pill);
            background: rgba(201, 168, 76, 0.12);
            overflow: hidden;
            margin-bottom: var(--space-3);
        }

        .diario-padrao-barra-fill {
            height: 100%;
            border-radius: var(--radius-pill);
            background: linear-gradient(90deg, var(--color-gold-deep), var(--color-gold-bright));
            transition: width 0.5s var(--ease-entrada);
        }

        .diario-padrao-topicos {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .diario-topico-chip {
            font-size: var(--text-xs);
            color: var(--color-text-soft);
            background: rgba(201, 168, 76, 0.08);
            border: 1px solid var(--color-border-muted);
            border-radius: var(--radius-pill);
            padding: 3px 10px;
        }

        .diario-topico-chip strong {
            color: var(--color-gold);
        }

        .diario-erros-lista {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .diario-erro-item {
            background: var(--color-surface);
            border: 1px solid var(--color-border-muted);
            border-left: 3px solid var(--color-danger);
            border-radius: var(--radius-md);
            padding: var(--space-4);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: var(--space-4);
            animation: diario-entrada 0.35s var(--ease-entrada) both;
        }

        @keyframes diario-entrada {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .diario-erro-corpo {
            flex: 1;
            min-width: 0;
        }

        .diario-erro-meta {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-xs);
            color: var(--color-text-muted);
            margin-bottom: var(--space-1);
            flex-wrap: wrap;
        }

        .diario-erro-ferramenta {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--color-gold);
            font-weight: 600;
        }

        .diario-erro-ferramenta svg {
            width: 12px;
            height: 12px;
        }

        .diario-erro-pergunta {
            color: var(--color-text);
            font-weight: 500;
            margin: 0 0 var(--space-1);
        }

        .diario-erro-respostas {
            font-size: var(--text-sm);
            color: var(--color-text-soft);
        }

        .diario-erro-respostas .errada {
            color: var(--color-danger);
            text-decoration: line-through;
        }

        .diario-erro-respostas .certa {
            color: #5fbf87;
        }

        .diario-erro-revisar {
            flex-shrink: 0;
            background: transparent;
            border: 1px solid var(--color-gold-deep);
            color: var(--color-gold-bright);
            border-radius: var(--radius-pill);
            padding: 6px 16px;
            font-size: var(--text-sm);
            cursor: pointer;
            transition: var(--transition-fast);
            text-decoration: none;
            white-space: nowrap;
        }

        .diario-erro-revisar:hover {
            background: rgba(201, 168, 76, 0.12);
            border-color: var(--color-gold-bright);
        }

        .diario-grafico-container {
            background: var(--color-surface);
            border: 1px solid var(--color-border-muted);
            border-radius: var(--radius-md);
            padding: var(--space-5);
            height: 280px;
        }

        .diario-estado-vazio {
            padding: var(--space-7) var(--space-5);
            text-align: center;
            color: var(--color-text-muted);
            background: var(--color-surface);
            border: 1px solid var(--color-border-muted);
            border-radius: var(--radius-md);
        }

        .diario-estado-vazio-icone {
            font-size: 32px;
            display: block;
            margin-bottom: var(--space-2);
        }
    </style>
