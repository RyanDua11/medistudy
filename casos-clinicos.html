<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStudy - Casos Clínicos</title>
    <link rel="icon" type="image/png" href="caduceu.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="pagina-home">

    <header id="header">
        <a href="home.html" class="logo-header">
            <img src="caduceu.png" alt="Logo">
            <span>MediStudy</span>
        </a>

        <div class="header-acoes">
            <button id="sino" aria-label="Notificações">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                </svg>
                <span class="badge"></span>
            </button>
            <div class="usuario-menu">
                <div class="avatar">RB</div>
                <svg class="chevron-usuario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
        </div>

    </header>

    <nav class="sidebar" aria-label="Navegação principal">
        <a href="home.html" class="sidebar-link" aria-label="Painel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        </a>
        <a href="flashcards.html" class="sidebar-link" aria-label="Flashcards">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="13" height="15" rx="2"/><path d="M3 3h13a2 2 0 0 1 2 2v13"/></svg>
        </a>
        <a href="casos-clinicos.html" class="sidebar-link ativo" aria-label="Casos Clínicos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-2.5 1.5-5-3-8-4.5 3-4.5 5.5-3 8"/><path d="M4 20l6-6M20 20l-6-6"/><circle cx="12" cy="9" r="1.5"/></svg>
        </a>
        <a href="provas.html" class="sidebar-link" aria-label="Agenda de provas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </a>
        <a href="notas.html" class="sidebar-link" aria-label="Notas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v18M4 8h5M4 13h5M4 18h5"/><path d="M14 5l6 2-1.5 12L14 17z"/></svg>
        </a>
    </nav>

<main>

    <a href="home.html" class="link-voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Painel
    </a>

    <h1 class="titulo-pagina">Casos Clínicos</h1>

    <div class="stat-cards-grid">
        <div class="stat-card" data-cor="dourado">
            <span class="stat-card-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-2.5 1.5-5-3-8-4.5 3-4.5 5.5-3 8"/><path d="M4 20l6-6M20 20l-6-6"/><circle cx="12" cy="9" r="1.5"/></svg>
            </span>
            <span class="stat-card-info">
                <span class="estatistica-valor" id="stat-total-casos">0</span>
                <span class="estatistica-rotulo">Casos disponíveis</span>
            </span>
        </div>
        <div class="stat-card" data-cor="verde">
            <span class="stat-card-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </span>
            <span class="stat-card-info">
                <span class="estatistica-valor" id="stat-casos-resolvidos">0</span>
                <span class="estatistica-rotulo">Resolvidos por você</span>
            </span>
        </div>
        <div class="stat-card" data-cor="roxo">
            <span class="stat-card-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
            </span>
            <span class="stat-card-info">
                <span class="estatistica-valor" id="stat-taxa-acerto-casos">0%</span>
                <span class="estatistica-rotulo">Taxa de acerto</span>
            </span>
        </div>
    </div>

    <section id="casos-clinicos">
        <div class="flashcards-coluna">
            <h2>Gerar novo caso</h2>
            <div class="input-group-simples">
                <label for="select-materia-caso">Matéria</label>
                <select id="select-materia-caso" aria-label="Escolher matéria">
                    <option value="">Escolha a matéria...</option>
                    <option value="Farmacologia II">Farmacologia II</option>
                    <option value="Patologia Clínica">Patologia Clínica</option>
                    <option value="Semiologia IV">Semiologia IV</option>
                    <option value="Microbiologia">Microbiologia</option>
                    <option value="Parasitologia">Parasitologia</option>
                    <option value="Humanidades">Humanidades</option>
                </select>
            </div>
            <button id="botao-gerar-caso" type="button">Gerar novo caso</button>
            <p id="caso-gerando" class="estado-carregando" hidden>Gerando caso clínico…</p>
            <p id="mensagem-casos" class="mensagem-erro" hidden></p>
        </div>

        <div class="flashcards-coluna">
            <h2>Resolver</h2>
            <div id="resolucao-vazia" class="estado-vazio">
                <span class="estado-vazio-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
                </span>
                <p>Escolha um caso na lista ao lado para resolver.</p>
            </div>
            <div id="resolucao-caso" hidden>
                <p id="resolucao-enunciado" class="resolucao-enunciado"></p>
                <p id="resolucao-pergunta" class="resolucao-pergunta"></p>
                <ul id="resolucao-alternativas"></ul>
                <div id="resolucao-feedback" hidden>
                    <p id="resolucao-resultado"></p>
                    <p id="resolucao-explicacao"></p>
                </div>
            </div>
        </div>

        <div class="flashcards-coluna">
            <h2>Casos existentes</h2>
            <p id="casos-carregando" class="estado-carregando">Carregando…</p>
            <ul id="lista-casos-clinicos"></ul>
            <div id="casos-vazio" class="estado-vazio" hidden>
                <span class="estado-vazio-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </span>
                <p>Nenhum caso clínico gerado ainda.</p>
            </div>
        </div>
    </section>

</main>

<script type="module" src="src/pages/casosClinicos/casosClinicosPage.js"></script>

</body>

</html>
